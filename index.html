<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ΑΣΕΠ • Προσωπική εξάσκηση</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#102d48">
</head>
<body>
    <main>
        <div class="panel" id="app"></div>
    </main>


    <nav class="mobile-nav" aria-label="Κύρια πλοήγηση κινητού">
      <button type="button" onclick="home()" aria-label="Αρχική"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-7h6v7"/></svg><span>Αρχική</span></button>
      <button type="button" onclick="selectMode('test')" aria-label="Τεστ γνώσεων"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>Τεστ γνώσεων</span></button>
      <button type="button" onclick="selectMode('study')" aria-label="Εκμάθηση"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 6c-2-2-5-2-9-2v16c4 0 7 0 9 2 2-2 5-2 9-2V4c-4 0-7 0-9 2Z"/><path d="M12 6v16"/></svg><span>Εκμάθηση</span></button>
      <button type="button" onclick="inductiveMenu('test')" aria-label="Τεστ σχημάτων"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Τεστ σχημάτων</span></button>
      <button type="button" onclick="inductiveMenu('study')" aria-label="Σχήματα"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 18a4 4 0 0 1-7-2 4 4 0 0 1-1-6 4 4 0 0 1 3-6 4 4 0 0 1 5 3Z"/><path d="M12 18a4 4 0 0 0 7-2 4 4 0 0 0 1-6 4 4 0 0 0-3-6 4 4 0 0 0-5 3Z"/><path d="M9 9v5m6-5v5"/></svg><span>Σχήματα</span></button>
    </nav>

    <script src="questions.js"></script>
    <script src="inductive-questions.js"></script>
    <script src="script.js"></script>
    <script>
      (function () {
        const nav = document.querySelector('.mobile-nav');
        if (!nav) return;
        nav.addEventListener('click', (event) => {
          const button = event.target.closest('button');
          if (!button) return;
          nav.querySelectorAll('button').forEach(item => item.classList.remove('is-active'));
          button.classList.add('is-active');
        });
      })();
    </script>
</body>
</html>
